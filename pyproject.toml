[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenomics-ai-gateway"
version = "0.1.0"
description = "Python helpers for the Tokenomics AI gateway"
requires-python = ">=3.10"
dependencies = [
    "llmlingua>=0.2.2",
    "ollama>=0.4.0",
    "serpapi>=0.1.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "backend"}
py-modules = ["modelRouting", "promptCompressing", "serpAPI_websearching", "helpers_server"]
