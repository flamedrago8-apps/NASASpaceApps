[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit-ai-gateway"
version = "0.1.0"
description = "Python helpers for the Conduit AI gateway"
requires-python = ">=3.10"
dependencies = [
    "llmlingua>=0.2.2",
    "ollama>=0.4.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}
py-modules = ["modelRouting", "promptCompressing"]
